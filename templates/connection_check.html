<div class="connection-tools"><button type="button" class="text-button" id="open-connection-check">Connection check</button><span class="app-version">Version {{ build_version }}</span></div>
<dialog id="connection-check-dialog" aria-labelledby="connection-check-heading"><h2 id="connection-check-heading">Connection check</h2><p id="connection-check-summary" class="message" role="status">Checking this device…</p><dl id="connection-check-results" class="connection-check-results"></dl><p id="connection-check-help" class="message"></p><p class="message">This check contains connection details only. It does not include student records, photos or passwords.</p><div class="dialog-actions"><button type="button" id="close-connection-check" class="button secondary">Close</button><button type="button" id="run-connection-check" class="button button-primary">Check again</button></div></dialog>
